<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício boas práticas de CSS</title>
    <link rel="stylesheet" href="bem/main.css">
</head>
<body>
    <header class="cabecalho">
        <h1 class="cabecalho__titulo">Catálogo de Produtos</h1>
        <p class="cabecalho__descricao">Confira nossos produtos em destaque!</p>
    </header>
    <main class="produtos">
        <div class="produtos__item">
            <img class="produtos__imagem" src="https://picsum.photos/100/100" alt="Imagem do produto">
            <h4 class="produtos__nome">Nome do produto</h4>
            <p class="produtos__descricao">Descrição do produto</p>
        </div>
        <div class="produtos__item produtos__item--destaque">
            <img class="produtos__imagem" src="https://picsum.photos/100/100" alt="Imagem do produto">
            <h4 class="produtos__nome">Produto em destaque</h4>
            <p class="produtos__descricao">Descrição do produto em destaque</p>
        </div>
        <div class="produtos__item">
            <img class="produtos__imagem" src="https://picsum.photos/100/100" alt="Imagem do produto">
            <h4 class="produtos__nome">Nome do produto</h4>
            <p class="produtos__descricao">Descrição do produto</p>
        </div>
    </main>
    <footer class="rodape">
        <p class="rodape__texto">&copy; 2025 EBAC. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
